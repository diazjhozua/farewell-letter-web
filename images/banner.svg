<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.98" />
      <stop offset="100%" style="stop-color:#fafbfc;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="300" fill="url(#bgGradient)"/>

  <!-- Title Section -->
  <text x="400" y="50" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Farewell Letter Web App</text>
  <text x="400" y="75" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="16">A beautiful, responsive web application with cinematic themes and elegant navigation</text>

  <!-- Demo Cards -->
  <!-- Left Card - Introduction Mode -->
  <rect x="50" y="100" width="180" height="120" fill="url(#cardGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="10"/>
  <text x="140" y="125" text-anchor="middle" fill="#1e3c72" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Introduction Mode</text>
  <text x="140" y="145" text-anchor="middle" fill="rgba(30,60,114,0.8)" font-family="Arial, sans-serif" font-size="12">✨ Cinematic Experience</text>
  <text x="140" y="165" text-anchor="middle" fill="rgba(30,60,114,0.8)" font-family="Arial, sans-serif" font-size="12">🎬 Full-screen Trailers</text>
  <text x="140" y="185" text-anchor="middle" fill="rgba(30,60,114,0.8)" font-family="Arial, sans-serif" font-size="12">👆 Swipe Navigation</text>

  <!-- Center Card - Letter View -->
  <rect x="280" y="100" width="240" height="120" fill="url(#letterGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="10"/>
  <text x="400" y="125" text-anchor="middle" fill="#1e3c72" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Authentic Letter Format</text>
  <text x="320" y="145" text-anchor="start" fill="rgba(30,60,114,0.7)" font-family="Georgia, serif" font-size="10">Dear Friend,</text>
  <text x="320" y="160" text-anchor="start" fill="rgba(30,60,114,0.8)" font-family="Georgia, serif" font-size="9">Thank you for all the wonderful memories...</text>
  <text x="320" y="175" text-anchor="start" fill="rgba(30,60,114,0.8)" font-family="Georgia, serif" font-size="9">Your kindness and friendship meant the world to me.</text>
  <text x="320" y="195" text-anchor="start" fill="rgba(30,60,114,0.7)" font-family="Georgia, serif" font-size="10">With warm regards,</text>
  <text x="450" y="210" text-anchor="start" fill="#1e3c72" font-family="Brush Script MT, cursive" font-size="12" font-weight="bold">Your Colleague</text>

  <!-- Right Card - Themes -->
  <rect x="570" y="100" width="180" height="120" fill="url(#cardGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="10"/>
  <text x="660" y="125" text-anchor="middle" fill="#1e3c72" font-family="Arial, sans-serif" font-size="14" font-weight="bold">5 Beautiful Themes</text>
  <text x="660" y="145" text-anchor="middle" fill="rgba(30,60,114,0.8)" font-family="Arial, sans-serif" font-size="11">Default • Tech • Business</text>
  <text x="660" y="160" text-anchor="middle" fill="rgba(30,60,114,0.8)" font-family="Arial, sans-serif" font-size="11">Girly • Futuristic</text>
  <text x="660" y="180" text-anchor="middle" fill="rgba(30,60,114,0.8)" font-family="Arial, sans-serif" font-size="11">🎨 Code-only switching</text>
  <text x="660" y="195" text-anchor="middle" fill="rgba(30,60,114,0.8)" font-family="Arial, sans-serif" font-size="11">📱 Fully responsive</text>

  <!-- Feature Icons -->
  <text x="100" y="260" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="12">📝 Authentic Letters</text>
  <text x="250" y="260" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="12">🎬 Cinematic Intro</text>
  <text x="400" y="260" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="12">📱 Touch Navigation</text>
  <text x="550" y="260" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="12">⚡ Zero Dependencies</text>
  <text x="700" y="260" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="12">🎨 Theme System</text>

  <!-- Sparkle Effects -->
  <text x="70" y="80" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial" font-size="16">✨</text>
  <text x="730" y="70" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="14">✨</text>
  <text x="150" y="50" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial" font-size="12">✨</text>
  <text x="650" y="45" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial" font-size="12">✨</text>

</svg>