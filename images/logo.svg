<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#backgroundGrad)" stroke="#ffffff" stroke-width="3" opacity="0.95"/>

  <!-- Envelope Body -->
  <rect x="50" y="80" width="100" height="70" fill="url(#envelopeGrad)" stroke="#1e3c72" stroke-width="2" rx="5"/>

  <!-- Envelope Flap -->
  <polygon points="50,80 100,110 150,80" fill="url(#envelopeGrad)" stroke="#1e3c72" stroke-width="2"/>

  <!-- Envelope Fold Lines -->
  <line x1="50" y1="80" x2="100" y2="110" stroke="#1e3c72" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="80" x2="100" y2="110" stroke="#1e3c72" stroke-width="1.5" opacity="0.7"/>

  <!-- Heart Detail -->
  <circle cx="100" cy="100" r="8" fill="#ec4899" opacity="0.8"/>
  <text x="100" y="105" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" font-weight="bold">♡</text>

  <!-- Sparkle Effects -->
  <text x="75" y="65" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="16" opacity="0.8">✨</text>
  <text x="125" y="140" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="12" opacity="0.6">✨</text>

</svg>