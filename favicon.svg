<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="32" height="32" fill="url(#bgGrad)" rx="6"/>

  <!-- Envelope -->
  <rect x="6" y="12" width="20" height="14" fill="#ffffff" stroke="none" rx="1"/>
  <polygon points="6,12 16,19 26,12" fill="#ffffff" stroke="none"/>
  <line x1="6" y1="12" x2="16" y2="19" stroke="#1e3c72" stroke-width="1"/>
  <line x1="26" y1="12" x2="16" y2="19" stroke="#1e3c72" stroke-width="1"/>

  <!-- Heart -->
  <circle cx="16" cy="18" r="2" fill="#ec4899"/>
</svg>